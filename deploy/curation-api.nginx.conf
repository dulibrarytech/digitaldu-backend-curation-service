# Concrete TLS front-end for the curation API on libsftp01.
# Place at /etc/nginx/conf.d/curation-api.conf, then `nginx -t && systemctl reload nginx`.
#
# This terminates TLS ON the curation server and proxies to gunicorn on
# loopback (127.0.0.1:8185, already the bind in curation-api.service). The
# only plaintext hop is the loopback interface — it never leaves the box.
#
# Prereqs:
#   - gunicorn stays bound to 127.0.0.1:8185 (see curation-api.service) so
#     :8185 is NOT reachable off-host. Do not change it to 0.0.0.0.
#   - A TLS cert whose SAN includes the hostname the Node backend dials
#     (libsftp01-vlp.du.edu). An internal-CA cert is fine; the Node side
#     trusts it via NODE_EXTRA_CA_CERTS (no public/Let's Encrypt cert needed).
#   - ssl_certificate must be the FULL CHAIN (leaf + any intermediates).

# NOTE: no `listen 80` block on purpose — this is an internal service-to-
# service endpoint with a single known client (the repo-backend-v2 host),
# so there is no reason to run a plaintext listener at all.

server {
    listen 443 ssl http2;
    server_name libsftp01-vlp.du.edu;   # must match the cert SAN and CURATION_API on the Node side

    # --- Certificate (full chain) ------------------------------------------
    ssl_certificate     /etc/pki/tls/certs/curation-api.fullchain.crt;
    ssl_certificate_key /etc/pki/tls/private/curation-api.key;

    # --- TLS hardening -----------------------------------------------------
    # If your other two nginx hosts already include an org-standard SSL
    # snippet (ciphers, protocols, OCSP, HSTS), prefer `include` of that
    # here instead of the four lines below so all three servers stay
    # consistent. These are safe modern defaults otherwise.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:curation_tls:5m;
    ssl_session_timeout 1h;

    # --- Optional: restrict who may reach this endpoint --------------------
    # Belt-and-braces on top of TLS. Uncomment and set to the repo-backend-v2
    # host's address(es) so only it can hit the API even on the internal net.
    # allow 10.x.x.x;        # repo-backend-v2 host
    # deny  all;

    # --- Optional: mutual TLS (phase-2 hardening) --------------------------
    # Strongest protection for the RCE-grade API key: require a client cert
    # so a leaked X-API-Key alone is useless. Enabling this ALSO requires a
    # small Node-side change (present a client cert via an https.Agent on the
    # curation axios clients) — it is NOT a drop-in. Leave commented until then.
    # ssl_client_certificate /etc/pki/tls/certs/du-internal-ca.crt;
    # ssl_verify_client on;

    # make_digital_objects can run up to ~1 hour; match the gunicorn timeout
    # (curation-api.service: --timeout 3700). nginx's 60s default would sever
    # these long calls mid-flight.
    proxy_read_timeout 3700s;
    proxy_send_timeout 3700s;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8185;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
